# Git hooks for every language, managed by lefthook (https://github.com/evilmartians/lefthook).
# Generated by agent-initiator. Activate once per clone with: lefthook install
# Never bypass these hooks with --no-verify; fix what they report instead.

commit-msg:
  scripts:
    "check-message.sh":
      runner: sh

post-commit:
  commands:
    graphify:
      # Keeps the code graph that AI agents query up to date. Never blocks a commit.
      run: graphify update . > /dev/null 2>&1 || true
