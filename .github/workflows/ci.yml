# Quality gates for every pull request, generated by agent-initiator.
# Same commands as AGENTS.md → Commands. Never weaken or skip a step to get a change merged; fix the cause.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: the checks only need to read the code.
permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  ci:
    name: "checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g corepack && corepack enable
      - name: install
        run: "pnpm install --frozen-lockfile"
      - name: typecheck
        run: "pnpm run typecheck"
      - name: test
        run: "pnpm run test"
      - name: build
        run: "pnpm run build"
      - name: audit
        run: "pnpm audit --audit-level high"
