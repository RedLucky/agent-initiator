# Quality gates for every pull request, generated by agent-initiator.
# Same commands as AGENTS.md → Commands. Never weaken or skip a step to get a change merged; fix the cause.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: the checks only need to read the code.
permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  ci:
    name: "checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install -g corepack && corepack enable
      - name: install
        run: "pnpm install --frozen-lockfile"
      - name: typecheck
        run: "pnpm run typecheck"
      - name: test
        run: "pnpm run test"
      - name: build
        run: "pnpm run build"
      - name: audit
        run: "pnpm audit --audit-level high"

  wiki-check:
    name: "wiki check (warning only)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: wiki updated with the code?
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh .lefthook/pre-push/check-wiki.sh --range "$BASE_SHA" "$HEAD_SHA"
